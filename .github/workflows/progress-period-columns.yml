name: Progress Lean period columns intake

on:
  push:
    branches:
      - add-quartic-318-326
    paths:
      - '.github/workflows/progress-period-columns.yml'
      - 'scripts/check_period_columns_intake.py'
      - 'scripts/test_period_columns_intake.py'
      - 'quartics/quartic-318-326/proof/intake/pel-period-columns-corrected-r2/**'

permissions:
  contents: read

concurrency:
  group: progress-period-columns-${{ github.ref }}
  cancel-in-progress: false

jobs:
  period-columns:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PROGRESS: quartics/quartic-318-326/proof/progress
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/setup-pinned-python/
            /.github/actions/setup-pinned-lean/
            /.github/actions/setup-pinned-dependency-sources/
            /scripts/check_period_columns_intake.py
            /scripts/test_period_columns_intake.py
            /scripts/check_progress_experiment.py
            /scripts/check_progress_lean.py
            /scripts/check_lean.py
            /scripts/pinned_dependency_sources.py
            /scripts/setup_pinned_lean.sh
            /lean/lean-toolchain
            /quartics/quartic-318-326/proof/progress/lean-toolchain
            /quartics/quartic-318-326/proof/progress/lakefile.toml
            /quartics/quartic-318-326/proof/progress/lake-manifest.json
            /quartics/quartic-318-326/proof/intake/pel-period-columns-corrected-r2/
      - uses: ./.github/actions/setup-pinned-python
        with:
          python-version: '3.12.14'
      - name: Check admission tests and exact upstream import roots
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/test_period_columns_intake.py -v
          python -B scripts/check_period_columns_intake.py targets > "$RUNNER_TEMP/period-targets.txt"
          test "$(wc -l < "$RUNNER_TEMP/period-targets.txt")" -eq 7
      - uses: ./.github/actions/setup-pinned-lean
      - uses: ./.github/actions/setup-pinned-dependency-sources
      - name: Fetch only pinned upstream artifacts needed by the packet
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/pinned_dependency_sources.py artifacts \
            --project "$PROGRESS" \
            --targets-file "$RUNNER_TEMP/period-targets.txt" \
            --receipt "$GITHUB_WORKSPACE/build/dependency-setup/period-artifacts.json"
      - name: Fresh strict Lean checks and recursive private-inclusive audit
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROGRESS"
          lake env python -B ../../../../scripts/check_period_columns_intake.py check \
            --output "$GITHUB_WORKSPACE/build/progress-period-columns"
      - name: Preserve diagnostics and scoped receipt, never project artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: period-columns-hosted-intake
          retention-days: 30
          if-no-files-found: ignore
          path: |
            build/dependency-setup/
            build/progress-period-columns/RESULT.json
            build/progress-period-columns/ExperimentAudit.lean
            build/progress-period-columns/logs/
