name: Build Version 5 research handoff

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quartic-1272-handoff
  cancel-in-progress: false

jobs:
  handoff:
    if: github.repository == 'elliotglazer/diophantine-z-q'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: ./.github/actions/setup-pinned-python
        with:
          python-version: '3.12.14'
      - uses: ./.github/actions/setup-pinned-node
        with:
          node-version: '26.13.0'
      - name: Check packaging and freeze exact snapshot
        shell: bash
        run: |
          ulimit -v 2097152
          mkdir -p build
          python -E -B scripts/check_quartic1272.py --out "$RUNNER_TEMP/quartic-1272-replay"
          python -E -B handoff/test_handoff.py > build/handoff-tests.json
          python -E -B handoff/prepare_handoff.py --repo . --commit "$GITHUB_SHA" --verification-receipt handoff/releases/version5/REPRODUCTION.json --output build/handoff-plan.json
      - name: Fetch unchanged historical baseline
        shell: bash
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/baseline.zip" https://github.com/elliotglazer/diophantine-z-q/releases/download/research-handoff-2026-11-04-r2/z-in-q-research-handoff-2026-11-04-r2.zip
          printf '827765f17087e1794c15770221a3a2d0fefed25839566a4a9bfb3b5aaa1ed42b  %s\n' "$RUNNER_TEMP/baseline.zip" | sha256sum --check -
      - name: Build and verify both handoffs
        shell: bash
        run: |
          ulimit -v 2097152
          python -E -B handoff/build_handoff.py --repo . --payload handoff/payload --plan build/handoff-plan.json --baseline "$RUNNER_TEMP/baseline.zip" --output build/handoff-output
          python -c "import hashlib,json,os,subprocess,sys; from pathlib import Path; a=Path('build/handoff-output/z-in-q-version5-current-handoff.zip'); p=Path('build/handoff-plan.json'); subprocess.run([sys.executable,'-E','-B','handoff/replay_extracted_current.py',str(a),'--expected-archive-sha256',hashlib.sha256(a.read_bytes()).hexdigest(),'--expected-plan-sha256',hashlib.sha256(p.read_bytes()).hexdigest(),'--extract',os.environ['RUNNER_TEMP']+'/current-handoff-extracted','--replay-output',os.environ['RUNNER_TEMP']+'/extracted-replay','--report','build/handoff-extraction.json'],check=True)"
          sha256sum quartic_1272.tex quartic_1272.pdf >> build/handoff-output/SHA256SUMS
      - name: Upload a draft release for final inspection
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! tag_record=$(git ls-remote --refs origin refs/tags/quartic-1272-version-5); then
            printf '%s\n' 'Could not check the remote tag; refusing to publish.' >&2
            exit 1
          fi
          if [ -n "$tag_record" ]; then
            printf '%s\n' 'Git tag already exists; refusing to overwrite it.' >&2
            exit 1
          fi
          if gh release view quartic-1272-version-5 >/dev/null 2>&1; then
            printf '%s\n' 'Release tag already exists; refusing to overwrite it.' >&2
            exit 1
          fi
          gh release create quartic-1272-version-5 --target "$GITHUB_SHA" --draft --title 'Version 5: the 1,272-variable quartic' --notes-file handoff/RELEASE_NOTES.md quartic_1272.tex quartic_1272.pdf build/handoff-output/z-in-q-version5-full-handoff.zip build/handoff-output/z-in-q-version5-current-handoff.zip build/handoff-output/SHA256SUMS build/handoff-output/BUILD_RECEIPT.json build/handoff-plan.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        if: always()
        with:
          name: version5-handoff-evidence
          path: |
            build/handoff-plan.json
            build/handoff-tests.json
            build/handoff-extraction.json
            build/handoff-output/BUILD_RECEIPT.json
            build/handoff-output/SHA256SUMS
