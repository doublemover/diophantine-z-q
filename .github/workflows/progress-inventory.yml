name: Progress Lean dependency-ready inventory

# Diagnostic only. One fixed independent inventory lane (at most four jobs).
# Exact marker-only source validation remains mandatory; never cancel an active run.
on:
  push:
    branches:
      - add-quartic-318-326
    paths:
      - .github/inventory-requests/progress.json

permissions:
  contents: read

concurrency:
  group: progress-inventory-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_packets: ${{ steps.plan.outputs.has_packets }}
      base: ${{ steps.plan.outputs.base }}
      snapshot: ${{ steps.plan.outputs.snapshot }}
      source_commit: ${{ steps.request.outputs.source_commit }}
      source_tree: ${{ steps.request.outputs.source_tree }}
      marker_sha256: ${{ steps.request.outputs.marker_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - uses: ./.github/actions/setup-pinned-python
        with:
          python-version: '3.12.14'
      - name: Validate exact marker-only launch before any inventory planning
        id: request
        run: python -B scripts/validate_progress_inventory_request.py --output build/dependency-setup/inventory-request.json --github-output "$GITHUB_OUTPUT"
      - run: python -B scripts/test_progress_inventory.py
      - run: python -B scripts/test_progress_sparse_checkout.py
      - id: plan
        run: python -B scripts/plan_progress_inventory.py --github-output "$GITHUB_OUTPUT"
      - name: Warm pinned compiler cache before inventory fan-out
        if: steps.plan.outputs.has_packets == 'true'
        uses: ./.github/actions/setup-pinned-lean
      - name: Warm verified dependency sources before inventory fan-out
        if: steps.plan.outputs.has_packets == 'true'
        uses: ./.github/actions/setup-pinned-dependency-sources
      - name: Preserve inventory plan setup evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: inventory-setup-plan
          path: build/dependency-setup/
          if-no-files-found: ignore

  inventory:
    needs: plan
    if: needs.plan.outputs.has_packets == 'true'
    name: Dependency-ready inventory ${{ matrix.artifact_key }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.job_minutes }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Set absolute inventory deadline including checkout and setup
        env:
          WINDOW_MINUTES: ${{ matrix.window_minutes }}
        run: echo "INVENTORY_DEADLINE=$(( $(date +%s) + WINDOW_MINUTES * 60 ))" >> "$GITHUB_ENV"
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: |
            .github
            scripts
            lean
            quartics/quartic-318-326/proof/progress
      - id: python
        uses: ./.github/actions/setup-pinned-python
        with:
          python-version: '3.12.14'
      - name: Materialize full packet and exact predecessor before validation
        id: materialize
        env:
          PACKET: ${{ matrix.packet }}
        run: python -B scripts/prepare_progress_sparse_checkout.py --packet "$PACKET"
      - name: Restore previously audited baseline
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .cache/progress-ci
          key: progress-v2-full-${{ needs.plan.outputs.base }}-${{ needs.plan.outputs.snapshot }}
          restore-keys: |
            progress-v2-full-${{ needs.plan.outputs.base }}-
      - uses: ./.github/actions/setup-pinned-lean
      - id: dependency_sources
        uses: ./.github/actions/setup-pinned-dependency-sources
      - name: Fetch exact pinned upstream artifacts
        id: upstream
        shell: bash
        env:
          PACKET: ${{ matrix.packet }}
        run: |
          set -euo pipefail
          python -B scripts/check_progress_experiment.py targets --packet "$PACKET" > "$RUNNER_TEMP/inventory-targets.txt"
          test -s "$RUNNER_TEMP/inventory-targets.txt"
          python -B scripts/pinned_dependency_sources.py artifacts \
            --project quartics/quartic-318-326/proof/progress \
            --targets-file "$RUNNER_TEMP/inventory-targets.txt" \
            --receipt "$GITHUB_WORKSPACE/build/dependency-setup/artifacts.json"
      - name: Record dependency-ready inventory and successful-subset audit
        if: always() && steps.checkout.outcome == 'success' && steps.python.outcome == 'success'
        env:
          PACKET: ${{ matrix.packet }}
          ARTIFACT_KEY: ${{ matrix.artifact_key }}
          TARGETS_JSON: ${{ matrix.targets_json }}
          SELECTION_SHA256: ${{ matrix.selection_sha256 }}
          WINDOW_MINUTES: ${{ matrix.window_minutes }}
          INVENTORY_SOURCE_COMMIT: ${{ needs.plan.outputs.source_commit }}
          INVENTORY_SOURCE_TREE: ${{ needs.plan.outputs.source_tree }}
          INVENTORY_REQUEST_SHA256: ${{ needs.plan.outputs.marker_sha256 }}
          SETUP_OK: ${{ steps.materialize.outcome == 'success' && steps.dependency_sources.outcome == 'success' && steps.upstream.outcome == 'success' }}
        run: |
          python -B scripts/check_progress_inventory.py --packet "$PACKET" \
            --cache "$GITHUB_WORKSPACE/.cache/progress-ci" \
            --output "$GITHUB_WORKSPACE/build/progress-inventory/$ARTIFACT_KEY" \
            --targets-json "$TARGETS_JSON" --selection-sha256 "$SELECTION_SHA256" \
            --window-minutes "$WINDOW_MINUTES" --deadline "$INVENTORY_DEADLINE" --setup-ok "$SETUP_OK"
      - name: Preserve inventory setup evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: inventory-setup-${{ matrix.artifact_key }}
          path: build/dependency-setup/
          if-no-files-found: ignore
      - name: Preserve inventory receipts and logs, never compiled artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: inventory-${{ matrix.artifact_key }}
          path: |
            build/progress-inventory/${{ matrix.artifact_key }}/INVENTORY.json
            build/progress-inventory/${{ matrix.artifact_key }}/logs/
            build/progress-inventory/${{ matrix.artifact_key }}/ExperimentAudit.lean
          if-no-files-found: warn
