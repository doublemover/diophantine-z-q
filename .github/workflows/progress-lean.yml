name: Progress Lean cohorts

on:
  push:
    paths:
      - 'quartics/quartic-318-326/proof/progress/**'
      - 'scripts/check_progress_lean.py'
      - 'scripts/check_lean.py'
      - 'scripts/test_progress_lean.py'
      - 'scripts/test_quartic_integration.py'
      - 'scripts/check_quartic_consumer_bindings.py'
      - 'scripts/progress_compile_weights.json'
      - '.github/workflows/progress-lean.yml'
      - '.github/actions/setup-pinned-*/**'
      - 'scripts/setup_pinned_lean.sh'
      - 'scripts/test_ci_tooling.py'
      - 'scripts/normalize_progress_bundles.py'
  pull_request:
    paths:
      - 'quartics/quartic-318-326/proof/progress/**'
      - 'scripts/check_progress_lean.py'
      - 'scripts/check_lean.py'
      - 'scripts/test_progress_lean.py'
      - 'scripts/test_quartic_integration.py'
      - 'scripts/check_quartic_consumer_bindings.py'
      - 'scripts/progress_compile_weights.json'
      - '.github/workflows/progress-lean.yml'
      - '.github/actions/setup-pinned-*/**'
      - 'scripts/setup_pinned_lean.sh'
      - 'scripts/test_ci_tooling.py'
      - 'scripts/normalize_progress_bundles.py'
  workflow_dispatch:
    inputs:
      clean:
        description: 'Rebuild every project module without reusing project artifacts'
        type: boolean
        default: false
      cohorts:
        description: 'Maximum cohorts per dependency stage (1-32)'
        type: number
        default: 16
      max_parallel:
        description: 'Maximum concurrent hosted cohort jobs (1-32)'
        type: number
        default: 16
      split_depth:
        description: 'Import depth separating the middle and final stages'
        type: number
        default: 16
      early_depth:
        description: 'Early import-depth boundary (0 disables the third stage)'
        type: number
        default: 7

permissions:
  contents: read

# Let a cold run finish and populate caches. The latest pending commit follows it.
concurrency:
  group: progress-lean-${{ github.ref }}
  cancel-in-progress: false

env:
  PROGRESS: quartics/quartic-318-326/proof/progress
  COHORTS: ${{ inputs.cohorts || 16 }}
  MAX_PARALLEL: ${{ inputs.max_parallel || 16 }}
  SPLIT_DEPTH: ${{ inputs.split_depth || 16 }}
  EARLY_DEPTH: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.early_depth) || '7' }}
  CLEAN: ${{ github.event_name == 'workflow_dispatch' && inputs.clean && 'true' || 'false' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      matrix0: ${{ steps.plan.outputs.matrix0 }}
      matrix1: ${{ steps.plan.outputs.matrix1 }}
      matrix2: ${{ steps.plan.outputs.matrix2 }}
      has_stage1: ${{ steps.plan.outputs.has_stage1 }}
      has_stage2: ${{ steps.plan.outputs.has_stage2 }}
      parallel: ${{ steps.plan.outputs.parallel }}
      base: ${{ steps.plan.outputs.base }}
      snapshot: ${{ steps.plan.outputs.snapshot }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: ./.github/actions/setup-pinned-python
        with:
          python-version: '3.12.14'
      - run: python -B -m unittest discover -s scripts -p 'test_*lean*.py' -v
      - run: python -B scripts/test_ci_tooling.py
      - run: python -B scripts/test_quartic_integration.py
      - id: plan
        run: python -B scripts/check_progress_lean.py plan --cohorts "$COHORTS" --early-depth "$EARLY_DEPTH" --split-depth "$SPLIT_DEPTH" --max-parallel "$MAX_PARALLEL" --output build/progress-plan.json --github-output "$GITHUB_OUTPUT"

      - name: Warm pinned compiler cache before matrix fan-out
        uses: ./.github/actions/setup-pinned-lean

  foundation:
    needs: plan
    name: Foundation cohort ${{ matrix.slot }} (${{ matrix.modules }} modules)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.parallel) }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix0) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: ./.github/actions/setup-pinned-python
        with:
          python-version: '3.12.14'
      - name: Restore audited whole snapshot
        id: whole-cache
        if: env.CLEAN != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0, Node 24
        with:
          path: .cache/progress-ci
          key: progress-v2-full-${{ needs.plan.outputs.base }}-${{ needs.plan.outputs.snapshot }}
          restore-keys: |
            progress-v2-full-${{ needs.plan.outputs.base }}-
      - name: Restore independently completed cohort fallback
        if: env.CLEAN != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0, Node 24
        with:
          path: .cache/progress-cohort
          key: progress-v2-${{ needs.plan.outputs.base }}-${{ matrix.stage }}-${{ matrix.slot }}-${{ matrix.key }}
          restore-keys: |
            progress-v2-${{ needs.plan.outputs.base }}-${{ matrix.stage }}-${{ matrix.slot }}-
      - uses: ./.github/actions/setup-pinned-lean
      - name: Fetch pinned upstream artifacts
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/check_progress_lean.py cache-targets > "$RUNNER_TEMP/progress-cache-targets.txt"
          mapfile -t targets < "$RUNNER_TEMP/progress-cache-targets.txt"
          test "${#targets[@]}" -gt 0
          cd "$PROGRESS"
          lake exe cache get "${targets[@]}"
      - name: Verify cache and kernel-check invalidated modules
        shell: bash
        run: |
          set -euo pipefail
          flags=()
          if [[ "$CLEAN" == true ]]; then flags+=(--clean); fi
          cd "$PROGRESS"
          lake env python -B ../../../../scripts/check_progress_lean.py build --fallback-cache "$GITHUB_WORKSPACE/.cache/progress-ci" --cohorts "$COHORTS" --early-depth "$EARLY_DEPTH" --split-depth "$SPLIT_DEPTH" --cohort '${{ matrix.id }}' --cache "$GITHUB_WORKSPACE/.cache/progress-cohort" --output "$GITHUB_WORKSPACE/build/progress-cohort-${{ matrix.id }}" "${flags[@]}"
      - name: Cache verified cohort artifacts
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0, Node 24
        with:
          path: .cache/progress-cohort
          key: progress-v2-${{ needs.plan.outputs.base }}-${{ matrix.stage }}-${{ matrix.slot }}-${{ matrix.key }}
      - name: Upload verified cohort
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: progress-cohort-${{ matrix.id }}
          path: build/progress-cohort-${{ matrix.id }}/
          retention-days: 7
      - name: Preserve failed-attempt logs separately from verified bundles
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: progress-failure-attempt-${{ github.run_attempt }}-cohort-${{ matrix.id }}
          path: |
            build/progress-cohort-${{ matrix.id }}/logs/
            build/progress-cohort-${{ matrix.id }}/commands.json
          retention-days: 7

  middle:
    needs: [plan, foundation]
    if: needs.plan.outputs.has_stage1 == 'true'
    name: Middle cohort ${{ matrix.slot }} (${{ matrix.modules }} modules)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.parallel) }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix1) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: ./.github/actions/setup-pinned-python
        with:
          python-version: '3.12.14'
      - name: Restore audited whole snapshot
        id: whole-cache
        if: env.CLEAN != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0, Node 24
        with:
          path: .cache/progress-ci
          key: progress-v2-full-${{ needs.plan.outputs.base }}-${{ needs.plan.outputs.snapshot }}
          restore-keys: |
            progress-v2-full-${{ needs.plan.outputs.base }}-
      - name: Restore independently completed cohort fallback
        if: env.CLEAN != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0, Node 24
        with:
          path: .cache/progress-cohort
          key: progress-v2-${{ needs.plan.outputs.base }}-${{ matrix.stage }}-${{ matrix.slot }}-${{ matrix.key }}
          restore-keys: |
            progress-v2-${{ needs.plan.outputs.base }}-${{ matrix.stage }}-${{ matrix.slot }}-
      - uses: ./.github/actions/setup-pinned-lean
      - name: Fetch pinned upstream artifacts
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/check_progress_lean.py cache-targets > "$RUNNER_TEMP/progress-cache-targets.txt"
          mapfile -t targets < "$RUNNER_TEMP/progress-cache-targets.txt"
          test "${#targets[@]}" -gt 0
          cd "$PROGRESS"
          lake exe cache get "${targets[@]}"
      - name: Download verified foundation inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, Node 24
        with:
          pattern: progress-cohort-*
          path: build/foundation-bundles
      - name: Normalize singleton or multi-cohort artifact layout
        run: python -B scripts/normalize_progress_bundles.py build/foundation-bundles
      - name: Verify cache and kernel-check invalidated modules
        shell: bash
        run: |
          set -euo pipefail
          flags=()
          if [[ "$CLEAN" == true ]]; then flags+=(--clean); fi
          cd "$PROGRESS"
          lake env python -B ../../../../scripts/check_progress_lean.py build --fallback-cache "$GITHUB_WORKSPACE/.cache/progress-ci" --cohorts "$COHORTS" --early-depth "$EARLY_DEPTH" --split-depth "$SPLIT_DEPTH" --cohort '${{ matrix.id }}' --bundles "$GITHUB_WORKSPACE/build/foundation-bundles" --cache "$GITHUB_WORKSPACE/.cache/progress-cohort" --output "$GITHUB_WORKSPACE/build/progress-cohort-${{ matrix.id }}" "${flags[@]}"
      - name: Cache verified cohort artifacts
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0, Node 24
        with:
          path: .cache/progress-cohort
          key: progress-v2-${{ needs.plan.outputs.base }}-${{ matrix.stage }}-${{ matrix.slot }}-${{ matrix.key }}
      - name: Upload verified cohort
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: progress-cohort-${{ matrix.id }}
          path: build/progress-cohort-${{ matrix.id }}/
          retention-days: 7
      - name: Preserve failed-attempt logs separately from verified bundles
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: progress-failure-attempt-${{ github.run_attempt }}-cohort-${{ matrix.id }}
          path: |
            build/progress-cohort-${{ matrix.id }}/logs/
            build/progress-cohort-${{ matrix.id }}/commands.json
          retention-days: 7

  dependent:
    needs: [plan, foundation, middle]
    if: always() && needs.foundation.result == 'success' && (needs.middle.result == 'success' || needs.middle.result == 'skipped') && needs.plan.outputs.has_stage2 == 'true'
    name: Dependent cohort ${{ matrix.slot }} (${{ matrix.modules }} modules)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.parallel) }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix2) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: ./.github/actions/setup-pinned-python
        with:
          python-version: '3.12.14'
      - name: Restore audited whole snapshot
        id: whole-cache
        if: env.CLEAN != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0, Node 24
        with:
          path: .cache/progress-ci
          key: progress-v2-full-${{ needs.plan.outputs.base }}-${{ needs.plan.outputs.snapshot }}
          restore-keys: |
            progress-v2-full-${{ needs.plan.outputs.base }}-
      - name: Restore independently completed cohort fallback
        if: env.CLEAN != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0, Node 24
        with:
          path: .cache/progress-cohort
          key: progress-v2-${{ needs.plan.outputs.base }}-${{ matrix.stage }}-${{ matrix.slot }}-${{ matrix.key }}
          restore-keys: |
            progress-v2-${{ needs.plan.outputs.base }}-${{ matrix.stage }}-${{ matrix.slot }}-
      - uses: ./.github/actions/setup-pinned-lean
      - name: Fetch pinned upstream artifacts
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/check_progress_lean.py cache-targets > "$RUNNER_TEMP/progress-cache-targets.txt"
          mapfile -t targets < "$RUNNER_TEMP/progress-cache-targets.txt"
          test "${#targets[@]}" -gt 0
          cd "$PROGRESS"
          lake exe cache get "${targets[@]}"
      - name: Download verified earlier-stage inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, Node 24
        with:
          pattern: progress-cohort-*
          path: build/foundation-bundles
      - name: Normalize singleton or multi-cohort artifact layout
        run: python -B scripts/normalize_progress_bundles.py build/foundation-bundles
      - name: Verify cache and kernel-check invalidated modules
        shell: bash
        run: |
          set -euo pipefail
          flags=()
          if [[ "$CLEAN" == true ]]; then flags+=(--clean); fi
          cd "$PROGRESS"
          lake env python -B ../../../../scripts/check_progress_lean.py build --fallback-cache "$GITHUB_WORKSPACE/.cache/progress-ci" --cohorts "$COHORTS" --early-depth "$EARLY_DEPTH" --split-depth "$SPLIT_DEPTH" --cohort '${{ matrix.id }}' --bundles "$GITHUB_WORKSPACE/build/foundation-bundles" --cache "$GITHUB_WORKSPACE/.cache/progress-cohort" --output "$GITHUB_WORKSPACE/build/progress-cohort-${{ matrix.id }}" "${flags[@]}"
      - name: Cache verified cohort artifacts
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0, Node 24
        with:
          path: .cache/progress-cohort
          key: progress-v2-${{ needs.plan.outputs.base }}-${{ matrix.stage }}-${{ matrix.slot }}-${{ matrix.key }}
      - name: Upload verified cohort
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: progress-cohort-${{ matrix.id }}
          path: build/progress-cohort-${{ matrix.id }}/
          retention-days: 7
      - name: Preserve failed-attempt logs separately from verified bundles
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: progress-failure-attempt-${{ github.run_attempt }}-cohort-${{ matrix.id }}
          path: |
            build/progress-cohort-${{ matrix.id }}/logs/
            build/progress-cohort-${{ matrix.id }}/commands.json
          retention-days: 7

  audit:
    needs: [plan, foundation, middle, dependent]
    if: always() && needs.foundation.result == 'success' && (needs.middle.result == 'success' || needs.middle.result == 'skipped') && (needs.dependent.result == 'success' || needs.dependent.result == 'skipped')
    name: Full progress axiom audit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: ./.github/actions/setup-pinned-python
        with:
          python-version: '3.12.14'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, Node 24
        with:
          pattern: progress-cohort-*
          path: build/cohort-bundles
      - name: Normalize singleton or multi-cohort artifact layout
        run: python -B scripts/normalize_progress_bundles.py build/cohort-bundles
      - uses: ./.github/actions/setup-pinned-lean
      - name: Fetch pinned upstream artifacts
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/check_progress_lean.py cache-targets > "$RUNNER_TEMP/progress-cache-targets.txt"
          mapfile -t targets < "$RUNNER_TEMP/progress-cache-targets.txt"
          test "${#targets[@]}" -gt 0
          cd "$PROGRESS"
          lake exe cache get "${targets[@]}"
      - name: Verify cohort compatibility and audit every declaration
        shell: bash
        run: |
          set -euo pipefail
          flags=()
          if [[ "$CLEAN" == true ]]; then flags+=(--clean); fi
          cd "$PROGRESS"
          lake env python -B ../../../../scripts/check_progress_lean.py audit --cache "$GITHUB_WORKSPACE/.cache/progress-ci" --cohorts "$COHORTS" --early-depth "$EARLY_DEPTH" --split-depth "$SPLIT_DEPTH" --bundles "$GITHUB_WORKSPACE/build/cohort-bundles" --output "$GITHUB_WORKSPACE/build/progress-audit" "${flags[@]}"
      - name: Cache complete audited snapshot
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0, Node 24
        with:
          path: .cache/progress-ci
          key: progress-v2-full-${{ needs.plan.outputs.base }}-${{ needs.plan.outputs.snapshot }}
      - name: Upload exact audit result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: progress-full-audit
          path: |
            build/progress-audit/RESULT.json
            build/progress-audit/logs/
          retention-days: 30
