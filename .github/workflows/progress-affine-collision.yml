name: Progress Lean affine collision intake

on:
  push:
    branches:
      - add-quartic-318-326
    paths:
      - '.github/workflows/progress-affine-collision.yml'
      - 'scripts/check_affine_collision_intake.py'
      - 'scripts/test_affine_collision_intake.py'
      - 'quartics/quartic-318-326/proof/intake/linear-a4-collision-bins-r1/**'
      - 'quartics/quartic-318-326/proof/progress/LinearA4GaussianCounts318.lean'
      - 'quartics/quartic-318-326/proof/progress/LinearA4MixedNormCounts318.lean'

permissions:
  contents: read

concurrency:
  group: progress-affine-collision-${{ github.ref }}
  cancel-in-progress: false

jobs:
  affine-collision:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PROGRESS: quartics/quartic-318-326/proof/progress
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/setup-pinned-python/
            /.github/actions/setup-pinned-lean/
            /.github/actions/setup-pinned-dependency-sources/
            /scripts/check_affine_collision_intake.py
            /scripts/test_affine_collision_intake.py
            /scripts/check_progress_experiment.py
            /scripts/check_progress_lean.py
            /scripts/check_lean.py
            /scripts/pinned_dependency_sources.py
            /scripts/setup_pinned_lean.sh
            /lean/lean-toolchain
            /quartics/quartic-318-326/proof/progress/lean-toolchain
            /quartics/quartic-318-326/proof/progress/lakefile.toml
            /quartics/quartic-318-326/proof/progress/lake-manifest.json
            /quartics/quartic-318-326/proof/progress/LinearA4GaussianCounts318.lean
            /quartics/quartic-318-326/proof/progress/LinearA4MixedNormCounts318.lean
            /quartics/quartic-318-326/proof/intake/linear-a4-collision-bins-r1/
      - uses: ./.github/actions/setup-pinned-python
        with:
          python-version: '3.12.14'
      - name: Check admission tests and exact upstream import roots
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/test_affine_collision_intake.py -v
          python -B scripts/check_affine_collision_intake.py targets > "$RUNNER_TEMP/affine-targets.txt"
          test "$(wc -l < "$RUNNER_TEMP/affine-targets.txt")" -eq 3
      - uses: ./.github/actions/setup-pinned-lean
      - uses: ./.github/actions/setup-pinned-dependency-sources
      - name: Fetch only pinned upstream artifacts needed by the packet
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/pinned_dependency_sources.py artifacts \
            --project "$PROGRESS" \
            --targets-file "$RUNNER_TEMP/affine-targets.txt" \
            --receipt "$GITHUB_WORKSPACE/build/dependency-setup/affine-artifacts.json"
      - name: Fresh strict Lean checks and recursive private-inclusive audit
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROGRESS"
          lake env python -B ../../../../scripts/check_affine_collision_intake.py check \
            --output "$GITHUB_WORKSPACE/build/progress-affine-collision"
      - name: Preserve diagnostics and scoped receipt, never project artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: affine-collision-hosted-intake
          retention-days: 30
          if-no-files-found: ignore
          path: |
            build/dependency-setup/
            build/progress-affine-collision/RESULT.json
            build/progress-affine-collision/logs/
