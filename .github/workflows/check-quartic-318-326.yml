name: Check 318/326 quartics

on:
  push:
    paths:
      - 'quartics/quartic-318-326/**'
      - 'scripts/check_quartic318_326.py'
      - '.github/workflows/check-quartic-318-326.yml'
  pull_request:
    paths:
      - 'quartics/quartic-318-326/**'
      - 'scripts/check_quartic318_326.py'
      - '.github/workflows/check-quartic-318-326.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: ./.github/actions/setup-pinned-python
        with:
          python-version: '3.12.14'
      - uses: ./.github/actions/setup-pinned-node
        with:
          node-version: '26.13.0'
      - run: python -B scripts/check_quartic318_326.py
