name: Check 318/326 quartics

on:
  push:
    paths:
      - 'quartics/quartic-318-326/**'
      - 'scripts/check_quartic318_326.py'
      - '.github/workflows/check-quartic-318-326.yml'
  pull_request:
    paths:
      - 'quartics/quartic-318-326/**'
      - 'scripts/check_quartic318_326.py'
      - '.github/workflows/check-quartic-318-326.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - run: python -B scripts/check_quartic318_326.py
