name: Research checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quartic394:
    name: Version 13 source and quartic replay (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.12.14'
          - os: windows-2022
            python: '3.12.10'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - run: python -B docs/manuscript-revisions/version13/portability/test_portability.py
      - run: python -B scripts/check_quartic394_portable.py
      - run: python -B scripts/check_version13_inventory.py
      - run: python -B scripts/check_audit_history.py --self-test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: quartic-394-${{ matrix.os }}
          path: build/quartic-394/
  quartic498:
    name: Version 12 source and quartic replay (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.12.14'
          - os: windows-2022
            python: '3.12.10'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26.13.0'
      - run: python -B scripts/check_audit_history.py --self-test
      - run: python -B scripts/check_quartic498.py
      - run: python -B docs/manuscript-revisions/version12/inventory/validate.py --repo . --self-test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: quartic-498-${{ matrix.os }}
          path: build/quartic-498/
  oddproduct:
    name: Version 9 odd-product replay (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.12.14'
          - os: windows-2022
            python: '3.12.10'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0, Node 24
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24
        with:
          node-version: '26.13.0'
      - run: python -B scripts/check_odd_product.py
      - run: python -B docs/quartic-523-540/inventory.py validate
      - run: python -B docs/manuscript-revisions/version10/check.py
      - run: python -B docs/manuscript-revisions/version10/check_valuation.py
      - run: python -B scripts/check_audit_history.py --self-test
      - run: python -B -m unittest discover -s docs/quartic-523-540 -p test_inventory.py -v
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        if: always()
        with:
          name: odd-product-${{ matrix.os }}
          path: build/odd-product/
  quartic962:
    name: Version 6 quartic reproduction and inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0, Node 24
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24
        with:
          node-version: '26.13.0'
      - run: python scripts/check_quartic962.py --out build/quartic-962-reproduction
      - run: python -E -B docs/quartic-962/inventory.py validate --repo . --manuscript manuscripts/quartic_v7.tex --expected-input-sha256 36646fd26f5adcaed33315605e4b1c333c1e60f5c917aeeda63976614823a0f5
      - run: python -E -B -m unittest discover -s docs/quartic-962 -p test_inventory.py -v
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        if: always()
        with:
          name: quartic-962-reproduction
          path: build/quartic-962-reproduction/
  quartic1272:
    name: Reconstructed quartic and Version 5 inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0, Node 24
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24
        with:
          node-version: '26.13.0'
      - run: python scripts/check_quartic1272.py --out build/quartic-1272-reproduction
      - run: python -E -B scripts/check_historical_inventory.py 5 validate --repo . --manuscript quartic_1272.tex --expected-input-sha256 695769c38917efa35b6256132cd8b77807d6384ab6d27c38f250ff8947ae6c10
      - run: python -E -B scripts/check_historical_inventory.py 5 test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        if: always()
        with:
          name: quartic-1272-reproduction
          path: build/quartic-1272-reproduction/
  construction:
    name: Construction regeneration and finite checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0, Node 24
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24
        with:
          node-version: '26.13.0'
      - run: python scripts/check_construction.py --report build/construction-checks.json
      - run: python -B docs/audit-history/issue3/replay_row_hash.py
      - run: python scripts/check_lean.py
      - run: python -B -m unittest discover -s scripts -p 'test_*lean*.py' -v
      - name: Validate theorem inventory bindings and references
        run: python docs/theorem-application-audit/validate.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        if: always()
        with:
          name: construction-checks
          path: build/construction-checks.json

  paper:
    name: Paper build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0, Node 24
        with:
          python-version: '3.12.14'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0, Node 24
        with:
          path: .cache/tectonic
          key: tectonic-${{ runner.os }}-0.17.0-6ffe055852f8faf66
      - run: python -E -B scripts/check_manuscript_revision.py
      - run: python -B docs/quartic-523-540/inventory.py validate
      - run: python -B docs/manuscript-revisions/version10/check.py
      - run: python -B docs/manuscript-revisions/version10/check_valuation.py
      - run: python scripts/build_paper.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        if: always()
        with:
          name: paper-build
          path: build/paper/

  lean:
    name: Accepted Lean helpers and axiom audit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0, Node 24
        with:
          python-version: '3.12.14'
      - name: Install pinned elan 4.2.4
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/elan-install"
          cd "$RUNNER_TEMP/elan-install"
          curl --fail --location --retry 3 -o elan.tar.gz https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz
          echo '42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  elan.tar.gz' | sha256sum --check -
          tar -xzf elan.tar.gz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      # Fetch upstream artifacts directly. Archiving the entire toolchain and
      # Mathlib tree again can exhaust the runner's disk during cache saving.
      - name: Fetch pinned dependency cache
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          python -B ../scripts/lean_cache_targets.py > "$RUNNER_TEMP/lean-cache-targets.txt"
          mapfile -t targets < "$RUNNER_TEMP/lean-cache-targets.txt"
          test "${#targets[@]}" -gt 0
          lake exe cache get "${targets[@]}"
      - name: Build every helper from fresh project artifacts and audit axioms
        run: python scripts/check_lean.py --build --output build/lean-ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        if: always()
        with:
          name: lean-audit
          path: |
            build/lean-ci/*.json
            build/lean-ci/*.log
