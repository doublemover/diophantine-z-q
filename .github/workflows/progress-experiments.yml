name: Progress Lean experiments

on:
  push:
    paths:
      - 'quartics/quartic-318-326/proof/experiments/**'
      - 'scripts/check_progress_experiment.py'
      - 'scripts/test_progress_experiment.py'
      - '.github/workflows/progress-experiments.yml'
      - '.github/actions/setup-pinned-*/**'
      - 'scripts/setup_pinned_lean.sh'
      - 'scripts/test_ci_tooling.py'
  workflow_dispatch:
    inputs:
      validation_lane:
        description: 'Use replay only for a newer reviewed head blocked by an older run'
        type: choice
        required: true
        default: main
        options:
          - main
          - replay

permissions:
  contents: read

# Keep pushes in the original serialized group and never cancel a running check.
# An explicit replay occupies one additional fixed lane, capped at four jobs.
# Do not use a SHA/run-id group: that would allow unbounded rapid-push fan-out.
concurrency:
  group: progress-experiments-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && inputs.validation_lane == 'replay' && '-replay' || '' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_packets: ${{ steps.plan.outputs.has_packets }}
      base: ${{ steps.plan.outputs.base }}
      snapshot: ${{ steps.plan.outputs.snapshot }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: ./.github/actions/setup-pinned-python
        with:
          python-version: '3.12.14'
      - run: python -B scripts/test_ci_tooling.py
      - run: python -B scripts/test_progress_experiment.py
      - run: python -B scripts/test_endpoint_diagnostic.py
      - run: python -B scripts/test_candidate_endpoint_diagnostic.py
      - run: python -B scripts/test_edge_elaboration_diagnostic.py
      - id: plan
        run: python -B scripts/check_progress_experiment.py plan --github-output "$GITHUB_OUTPUT"

      - name: Warm pinned compiler cache before matrix fan-out
        if: steps.plan.outputs.has_packets == 'true'
        uses: ./.github/actions/setup-pinned-lean

  first-check:
    needs: plan
    if: needs.plan.outputs.has_packets == 'true'
    name: Experimental packet ${{ matrix.packet }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_lane == 'replay' && 4 || 16 }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: ./.github/actions/setup-pinned-python
        with:
          python-version: '3.12.14'
      - name: Restore previously audited baseline
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0, Node 24
        with:
          path: .cache/progress-ci
          key: progress-v2-full-${{ needs.plan.outputs.base }}-${{ needs.plan.outputs.snapshot }}
          restore-keys: |
            progress-v2-full-${{ needs.plan.outputs.base }}-
      - uses: ./.github/actions/setup-pinned-lean
      - name: Fetch exact pinned upstream artifacts
        shell: bash
        env:
          PACKET: ${{ matrix.packet }}
        run: |
          set -euo pipefail
          python -B scripts/check_progress_experiment.py targets --packet "$PACKET" > "$RUNNER_TEMP/experiment-targets.txt"
          mapfile -t targets < "$RUNNER_TEMP/experiment-targets.txt"
          test "${#targets[@]}" -gt 0
          cd quartics/quartic-318-326/proof/progress
          lake exe cache get "${targets[@]}"
      - name: First strict checks and new-declaration audit
        shell: bash
        env:
          PACKET: ${{ matrix.packet }}
        run: |
          set -euo pipefail
          cd quartics/quartic-318-326/proof/progress
          lake env python -B ../../../../scripts/check_progress_experiment.py check --packet "$PACKET" --cache "$GITHUB_WORKSPACE/.cache/progress-ci" --output "$GITHUB_WORKSPACE/build/progress-experiments/$PACKET" --seconds 180
      - name: Non-admitted endpoint scratch diagnostics
        if: always() && matrix.packet == 'contact-relative-site-descent-r26'
        shell: bash
        env:
          PACKET: ${{ matrix.packet }}
        run: |
          set -euo pipefail
          cd quartics/quartic-318-326/proof/progress
          lake env python -B ../../../../scripts/diagnose_original_endpoint.py --packet "$PACKET"
      - name: Non-admitted candidate endpoint and edge diagnostics
        if: always() && matrix.packet == 'contact-relative-site-descent-r27'
        shell: bash
        env:
          PACKET: ${{ matrix.packet }}
        run: |
          set -euo pipefail
          cd quartics/quartic-318-326/proof/progress
          lake env python -B ../../../../scripts/diagnose_candidate_endpoint.py --packet "$PACKET"
      - name: Non-admitted edge elaboration bisection
        if: always() && matrix.packet == 'contact-relative-site-descent-r27'
        shell: bash
        env:
          PACKET: ${{ matrix.packet }}
        run: |
          set -euo pipefail
          cd quartics/quartic-318-326/proof/progress
          lake env python -B ../../../../scripts/diagnose_edge_elaboration.py --packet "$PACKET"
      - name: Upload bounded results and error logs only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: experiment-${{ matrix.packet }}
          path: |
            build/progress-experiments/${{ matrix.packet }}/RESULT.json
            build/progress-experiments/${{ matrix.packet }}/logs/
            build/progress-experiments/${{ matrix.packet }}/ExperimentAudit.lean
            build/progress-experiments/${{ matrix.packet }}/scratch-diagnostics/
            build/progress-experiments/${{ matrix.packet }}/scratch-candidate-diagnostics/
            build/progress-experiments/${{ matrix.packet }}/scratch-edge-elaboration/
          retention-days: 3
# Only the tooling composite actions save runtime caches. Experimental proof
# artifacts never enter the accepted baseline or any project artifact cache.
