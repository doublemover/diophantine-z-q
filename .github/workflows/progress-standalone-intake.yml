name: Progress Lean standalone intake

on:
  push:
    branches:
      - add-quartic-318-326
    paths:
      - '.github/workflows/progress-standalone-intake.yml'
      - '.github/actions/setup-pinned-python/**'
      - '.github/actions/setup-pinned-lean/**'
      - '.github/actions/setup-pinned-dependency-sources/**'
      - 'scripts/check_standalone_intake.py'
      - 'scripts/test_standalone_intake.py'
      - 'scripts/test_standalone_mathlib_intake.py'
      - 'scripts/pinned_dependency_sources.py'
      - 'scripts/check_lean.py'
      - 'scripts/check_progress_lean.py'
      - 'scripts/check_progress_experiment.py'
      - 'scripts/setup_pinned_lean.sh'
      - 'lean/lean-toolchain'
      - 'quartics/quartic-318-326/proof/progress/lean-toolchain'
      - 'quartics/quartic-318-326/proof/progress/lakefile.toml'
      - 'quartics/quartic-318-326/proof/progress/lake-manifest.json'
      - 'quartics/quartic-318-326/proof/intake/linear-a4-weighted-readback-core-r1/**'
      - 'quartics/quartic-318-326/proof/intake/pel-original-order-gram-r2/**'
      - 'quartics/quartic-318-326/proof/intake/finite-height-dlog-rows-r3/**'
      - 'quartics/quartic-318-326/proof/intake/pel-period-columns-corrected-r2/QuaternionicRealPeriod318.lean'
      - 'quartics/quartic-318-326/proof/intake/pel-period-columns-corrected-r2/SelectedActualPELPeriodColumns318.lean'

permissions:
  contents: read

concurrency:
  group: progress-standalone-intake-${{ github.ref }}
  cancel-in-progress: false

jobs:
  standalone:
    name: Standalone intake (${{ matrix.packet }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - packet: linear-a4-weighted-readback-core-r1
            profile: lean-core
            root_count: 0
          - packet: pel-original-order-gram-r2
            profile: pinned-mathlib
            root_count: 9
          - packet: finite-height-dlog-rows-r3
            profile: pinned-mathlib
            root_count: 6
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PACKET: ${{ matrix.packet }}
      PROFILE: ${{ matrix.profile }}
      ROOT_COUNT: ${{ matrix.root_count }}
      PROGRESS: quartics/quartic-318-326/proof/progress
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/setup-pinned-python/
            /.github/actions/setup-pinned-lean/
            /.github/actions/setup-pinned-dependency-sources/
            /scripts/check_standalone_intake.py
            /scripts/test_standalone_intake.py
            /scripts/test_standalone_mathlib_intake.py
            /scripts/pinned_dependency_sources.py
            /scripts/check_lean.py
            /scripts/check_progress_lean.py
            /scripts/check_progress_experiment.py
            /scripts/setup_pinned_lean.sh
            /lean/lean-toolchain
            /quartics/quartic-318-326/proof/progress/lean-toolchain
            /quartics/quartic-318-326/proof/progress/lakefile.toml
            /quartics/quartic-318-326/proof/progress/lake-manifest.json
            /quartics/quartic-318-326/proof/intake/linear-a4-weighted-readback-core-r1/
            /quartics/quartic-318-326/proof/intake/pel-original-order-gram-r2/
            /quartics/quartic-318-326/proof/intake/finite-height-dlog-rows-r3/
            /quartics/quartic-318-326/proof/intake/pel-period-columns-corrected-r2/QuaternionicRealPeriod318.lean
            /quartics/quartic-318-326/proof/intake/pel-period-columns-corrected-r2/SelectedActualPELPeriodColumns318.lean
      - uses: ./.github/actions/setup-pinned-python
        with:
          python-version: '3.12.14'
      - name: Fixture replay and exact no-baseline source admission
        shell: bash
        run: |
          set -euo pipefail
          case "$PROFILE" in
            lean-core)
              python -E -s -B scripts/test_standalone_intake.py -v
              targets="$RUNNER_TEMP/standalone-targets.txt"
              ;;
            pinned-mathlib)
              python -E -s -B scripts/test_standalone_mathlib_intake.py -v
              mkdir -p build/dependency-setup
              targets="build/dependency-setup/$PACKET.targets.txt"
              ;;
            *) exit 2 ;;
          esac
          python -E -s -B scripts/check_standalone_intake.py targets --packet "$PACKET" > "$targets"
          test "$(wc -l < "$targets")" -eq "$ROOT_COUNT"
      - uses: ./.github/actions/setup-pinned-lean
      - uses: ./.github/actions/setup-pinned-dependency-sources
        if: matrix.profile == 'pinned-mathlib'
      - name: Fetch only reviewed pinned upstream roots
        if: matrix.profile == 'pinned-mathlib'
        shell: bash
        run: |
          set -euo pipefail
          python -E -s -B scripts/pinned_dependency_sources.py artifacts \
            --project "$PROGRESS" \
            --targets-file "build/dependency-setup/$PACKET.targets.txt" \
            --receipt "build/dependency-setup/$PACKET.artifacts.json"
      - name: Compile only fresh sources and audit private declarations
        shell: bash
        run: |
          set -euo pipefail
          python -E -s -B scripts/check_standalone_intake.py check --packet "$PACKET"
      - name: Preserve scoped receipt, never project artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: standalone-intake-${{ matrix.packet }}
          retention-days: 30
          if-no-files-found: ignore
          path: |
            build/progress-standalone-intake/${{ matrix.packet }}/RESULT.json
            build/progress-standalone-intake/${{ matrix.packet }}/ExperimentAudit.lean
            build/progress-standalone-intake/${{ matrix.packet }}/logs/
            build/dependency-setup/sources.json
            build/dependency-setup/sources.log
            build/dependency-setup/${{ matrix.packet }}.targets.txt
            build/dependency-setup/${{ matrix.packet }}.artifacts.json
            build/dependency-setup/${{ matrix.packet }}.artifacts.log
