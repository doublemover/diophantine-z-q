name: Exact original 119136 proof one-shot
'on':
  push:
    branches:
    - add-quartic-318-326
    paths:
    - docs/ci-original-119136-physical-once/REQUEST.json
permissions:
  contents: read
concurrency:
  group: exact-original-119136-proof-once
  cancel-in-progress: false
jobs:
  verify:
    name: Scoped strict physical (${{ matrix.packet }})
    if: github.repository == 'doublemover/diophantine-z-q' && github.ref == 'refs/heads/add-quartic-318-326' && github.event.before
      == '8791aae02a7e53a012253edb979e70a19921c6d3' && github.run_attempt == 1 && !github.event.forced && join(github.event.commits.*.id,
      ',') == github.sha && github.event.head_commit.message == 'Strict physical 119136 marked arithmetic and original calibration'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
        - packet: original-119136-sparse-height-r1
          roots: 14
        - packet: original-119136-hz-tangent-calibration-r1
          roots: 6
    env:
      PACKET: ${{ matrix.packet }}
      ROOT_COUNT: ${{ matrix.roots }}
      DRIVER: docs/ci-original-119136-physical-once/run.py
      PROGRESS: quartics/quartic-318-326/proof/progress
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 2
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /.github/actions/setup-pinned-dependency-sources/action.yml
          /.github/actions/setup-pinned-lean/action.yml
          /.github/actions/setup-pinned-python/action.yml
          /.github/workflows/original-119136-physical-once.yml
          /docs/ci-original-119136-physical-once/CONTRACT.json
          /docs/ci-original-119136-physical-once/PROVENANCE.json
          /docs/ci-original-119136-physical-once/REQUEST.json
          /docs/ci-original-119136-physical-once/run.py
          /lean/lean-toolchain
          /quartics/quartic-318-326/proof/intake/original-119136-hz-tangent-calibration-r1/OriginalMarkedIntPolynomialCertificate318.lean
          /quartics/quartic-318-326/proof/intake/original-119136-hz-tangent-calibration-r1/OriginalPhysicalHZ210Coefficients318.lean
          /quartics/quartic-318-326/proof/intake/original-119136-hz-tangent-calibration-r1/OriginalPhysicalHZ210Identity318.lean
          /quartics/quartic-318-326/proof/intake/original-119136-hz-tangent-calibration-r1/OriginalPhysicalHZ210Map318.lean
          /quartics/quartic-318-326/proof/intake/original-119136-hz-tangent-calibration-r1/OriginalPhysicalNaganoFirstJet318.lean
          /quartics/quartic-318-326/proof/intake/original-119136-hz-tangent-calibration-r1/OriginalPhysicalNaganoFourRoot318.lean
          /quartics/quartic-318-326/proof/intake/original-119136-hz-tangent-calibration-r1/OriginalPhysicalNaganoGauge318.lean
          /quartics/quartic-318-326/proof/intake/original-119136-hz-tangent-calibration-r1/OriginalPhysicalNaganoJet318.lean
          /quartics/quartic-318-326/proof/intake/original-119136-hz-tangent-calibration-r1/OriginalPhysicalNaganoReadback318.lean
          /quartics/quartic-318-326/proof/intake/original-119136-hz-tangent-calibration-r1/OriginalPolarizedContactGauge318.lean
          /quartics/quartic-318-326/proof/intake/original-119136-hz-tangent-calibration-r1/OriginalRadixHZCertificate318.lean
          /quartics/quartic-318-326/proof/intake/original-119136-hz-tangent-calibration-r1/intake.json
          /quartics/quartic-318-326/proof/intake/original-119136-sparse-height-r1/OriginalActualSexticInt318.lean
          /quartics/quartic-318-326/proof/intake/original-119136-sparse-height-r1/OriginalActualSparseJetArithmetic318.lean
          /quartics/quartic-318-326/proof/intake/original-119136-sparse-height-r1/OriginalActualSparseMarkedHeight318.lean
          /quartics/quartic-318-326/proof/intake/original-119136-sparse-height-r1/OriginalHodgeIdealFromFull33_318.lean
          /quartics/quartic-318-326/proof/intake/original-119136-sparse-height-r1/OriginalHodgeModuleOverlap318.lean
          /quartics/quartic-318-326/proof/intake/original-119136-sparse-height-r1/OriginalOneMarkedHeight318.lean
          /quartics/quartic-318-326/proof/intake/original-119136-sparse-height-r1/OriginalRawScalarCalibration318.lean
          /quartics/quartic-318-326/proof/intake/original-119136-sparse-height-r1/OriginalSeparableSexticJet318.lean
          /quartics/quartic-318-326/proof/intake/original-119136-sparse-height-r1/OriginalSexticCoefficientAudit318.lean
          /quartics/quartic-318-326/proof/intake/original-119136-sparse-height-r1/OriginalSexticIntegralTower318.lean
          /quartics/quartic-318-326/proof/intake/original-119136-sparse-height-r1/OriginalSexticJetMarked318.lean
          /quartics/quartic-318-326/proof/intake/original-119136-sparse-height-r1/OriginalSexticJetResidues318.lean
          /quartics/quartic-318-326/proof/intake/original-119136-sparse-height-r1/OriginalTwoLevelHodgeLattice318.lean
          /quartics/quartic-318-326/proof/intake/original-119136-sparse-height-r1/OriginalTwoMarkedTensorsR8_318.lean
          /quartics/quartic-318-326/proof/intake/original-119136-sparse-height-r1/intake.json
          /quartics/quartic-318-326/proof/intake/original-marked-calibration-prefix-r1/OriginalMarkedHeightCalibration318.lean
          /quartics/quartic-318-326/proof/intake/original-marked-calibration-prefix-r1/SectionHeight318.lean
          /quartics/quartic-318-326/proof/intake/original-marked-calibration-prefix-r1/SelectedSameABicanonicalYuanFrame318.lean
          /quartics/quartic-318-326/proof/intake/original-marked-calibration-prefix-r3/SelectedSameADirectBicanonicalHeight318.lean
          /quartics/quartic-318-326/proof/intake/original-marked-calibration-prefix-r5/OriginalGlobalHodgeIdealHeight318.lean
          /quartics/quartic-318-326/proof/intake/original-marked-calibration-prefix-r7/OriginalMarkedHodgeTensorHeight318.lean
          /quartics/quartic-318-326/proof/intake/original-marked-calibration-prefix-r8/FiveContactMetricBounds318.lean
          /quartics/quartic-318-326/proof/progress/Contact49Growth318.lean
          /quartics/quartic-318-326/proof/progress/InducedLattice318.lean
          /quartics/quartic-318-326/proof/progress/RationalAbsoluteHeight.lean
          /quartics/quartic-318-326/proof/progress/RationalSectionHeight318.lean
          /quartics/quartic-318-326/proof/progress/SelectedActualSameACurvature64.lean
          /quartics/quartic-318-326/proof/progress/lake-manifest.json
          /quartics/quartic-318-326/proof/progress/lakefile.toml
          /quartics/quartic-318-326/proof/progress/lean-toolchain
          /scripts/check_lean.py
          /scripts/check_progress_experiment.py
          /scripts/check_progress_lean.py
          /scripts/check_standalone_intake.py
          /scripts/pinned_dependency_sources.py
          /scripts/setup_pinned_lean.sh
    - name: Verify exact approval paths and stock source admission before setup
      shell: bash
      run: |-
        set -euo pipefail
        echo '1081ffd64edb87bb2c0a8e9dc3eb2aab5d8d47fe16008b0cc8300d3dd468aafb  docs/ci-original-119136-physical-once/run.py' | sha256sum -c -
        echo '417a997c70f8cee4a16a385ee29caca9cb6d42e18894bb7be2d9f1a2e22f5da0  docs/ci-original-119136-physical-once/CONTRACT.json' | sha256sum -c -
        mkdir -p build/dependency-setup
        python3 -I -B "$DRIVER" targets --packet "$PACKET" > "build/dependency-setup/$PACKET.targets.txt"
        test "$(wc -l < "build/dependency-setup/$PACKET.targets.txt")" -eq "$ROOT_COUNT"
    - uses: ./.github/actions/setup-pinned-python
      with:
        python-version: 3.12.14
    - uses: ./.github/actions/setup-pinned-lean
    - uses: ./.github/actions/setup-pinned-dependency-sources
    - name: Fetch only exact reviewed official roots
      shell: bash
      run: |-
        set -euo pipefail
        python -E -s -B scripts/pinned_dependency_sources.py artifacts --project "$PROGRESS" --targets-file "build/dependency-setup/$PACKET.targets.txt" --receipt "build/dependency-setup/$PACKET.artifacts.json"
    - name: One fresh stock compilation and one final recursive audit
      shell: bash
      run: timeout 900s python -I -B "$DRIVER" check --packet "$PACKET"
    - name: Preserve scoped logs with zero project artifacts
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: scoped-backward-${{ matrix.packet }}
        retention-days: 7
        if-no-files-found: ignore
        path: |
          build/progress-standalone-intake/${{ matrix.packet }}/RESULT.json
          build/progress-standalone-intake/${{ matrix.packet }}/ExperimentAudit.lean
          build/progress-standalone-intake/${{ matrix.packet }}/logs
          build/dependency-setup/sources.json
          build/dependency-setup/${{ matrix.packet }}.artifacts.json
          build/dependency-setup/${{ matrix.packet }}.artifacts.log
          build/dependency-setup/${{ matrix.packet }}.targets.txt
