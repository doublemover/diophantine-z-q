name: Five-contact finite KS image probe
on:
  push:
    branches: [add-quartic-318-326]
    paths:
      - 'quartics/quartic-318-326/proof/intake/contact-ks-local-image-r1/**'
      - '.github/workflows/contact-ks-local-image-probe.yml'
permissions:
  contents: read
concurrency:
  group: contact-ks-local-image-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  exact-leaf:
    name: Exact finite KS lattice-to-norm leaf
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ELAN_TOOLCHAIN: leanprover/lean4:v4.35.0
      PROGRESS: quartics/quartic-318-326/proof/progress
      PROBE: quartics/quartic-318-326/proof/intake/contact-ks-local-image-r1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/setup-pinned-lean/
            /.github/actions/setup-pinned-python/
            /.github/actions/setup-pinned-dependency-sources/
            /lean/lean-toolchain
            /scripts/
            /quartics/quartic-318-326/proof/progress/SectionHeight318.lean
            /quartics/quartic-318-326/proof/progress/lean-toolchain
            /quartics/quartic-318-326/proof/progress/lake-manifest.json
            /quartics/quartic-318-326/proof/progress/lakefile.toml
            /quartics/quartic-318-326/proof/intake/contact-ks-local-image-r1/
      - uses: ./.github/actions/setup-pinned-python
        with:
          python-version: '3.12.14'
      - uses: ./.github/actions/setup-pinned-lean
      - uses: ./.github/actions/setup-pinned-dependency-sources
      - name: Fetch only seven exact official stock roots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/dependency-setup
          python -B "$PROBE/check.py" targets > build/dependency-setup/contact-ks.targets.txt
          python -B scripts/pinned_dependency_sources.py artifacts --project "$PROGRESS" \
            --targets-file build/dependency-setup/contact-ks.targets.txt \
            --receipt build/dependency-setup/contact-ks.artifacts.json
      - name: Replay exact leaf and audit all its dependencies
        shell: bash
        run: timeout 360s python -B "$PROBE/check.py" check
      - name: Preserve narrowly scoped receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: contact-ks-local-image
          path: |
            build/contact-ks-local-image/RESULT.json
            build/contact-ks-local-image/GaugeAudit.lean
            build/contact-ks-local-image/logs/
            build/dependency-setup/contact-ks.artifacts.json
            build/dependency-setup/contact-ks.targets.txt
          if-no-files-found: ignore
          retention-days: 14
